name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check JavaScript
        run: node --check app.js && node --check sw.js
      - name: Required files present
        run: test -f index.html && test -f style.css && test -f manifest.webmanifest && test -f icon.svg
      - name: CSP allows the AI providers the assistant supports
        run: grep -q "connect-src" index.html
